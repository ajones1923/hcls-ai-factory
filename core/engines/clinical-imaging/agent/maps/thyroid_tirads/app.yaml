# ═══════════════════════════════════════════════════════════════════
# Thyroid TI-RADS Classification — MONAI Application Package Manifest
# ═══════════════════════════════════════════════════════════════════
#
# MONAI Deploy App SDK application descriptor.
# Used by `monai-deploy package` to build the MAP container.
#
# License: Apache 2.0

application:
  title: Thyroid TI-RADS Classification
  version: 1.0.0
  description: >
    GPU-accelerated thyroid nodule classification with ACR TI-RADS
    point scoring. Characterizes nodule features (composition,
    echogenicity, shape, margin, echogenic foci) on ultrasound and
    generates FNA biopsy recommendation per ACR guidelines. Generates
    DICOM SR output with TID 1500 Measurement Report.

  # Entry point
  command: python -m maps.thyroid_tirads

  # Clinical metadata
  clinical_domain: head_and_neck_radiology
  body_region: thyroid
  modality: US
  indication: thyroid_nodule_characterization
  scoring_system: ACR TI-RADS
  target_population: adults

input:
  - path: /input
    formats:
      - dicom
    description: >
      DICOM thyroid ultrasound images (US modality). Accepts transverse
      and longitudinal views with THYROID or NECK body part.

output:
  - path: /output
    formats:
      - dicom-sr
      - json
    description: >
      DICOM Structured Report (TID 1500) with nodule feature characterization,
      ACR TI-RADS score and category, and FNA recommendation.
      JSON result with full WorkflowResult.

resources:
  cpu: 2
  gpu: 1
  memory: 4Gi
  gpu_memory: 2Gi

timeout: 60

# NVIDIA technologies used
nvidia_technologies:
  - MONAI Deploy App SDK
  - TensorRT (optional)

# Model details
models:
  - name: Thyroid nodule classification
    architecture: EfficientNet-B4
    source: Custom trained
    input_shape: 1x1x256x256
    output: feature classification (composition, echogenicity, shape, margin, foci)

# Regulatory notes
regulatory:
  intended_use: >
    Research and development use only. Not cleared for clinical
    diagnostic use. Results must be reviewed by qualified physicians.
  classification: Class II (triage/notification)
  standards:
    - DICOM SR TID 1500
    - ACR TI-RADS (2017)
