# ═══════════════════════════════════════════════════════════════════
# Liver LI-RADS Classification — MONAI Application Package Manifest
# ═══════════════════════════════════════════════════════════════════
#
# MONAI Deploy App SDK application descriptor.
# Used by `monai-deploy package` to build the MAP container.
#
# License: Apache 2.0

application:
  title: Liver LI-RADS Classification
  version: 1.0.0
  description: >
    GPU-accelerated liver observation classification with LI-RADS v2018.
    Analyzes multiphase CT/MRI for arterial phase hyperenhancement (APHE),
    washout appearance, and enhancing capsule to classify hepatocellular
    carcinoma probability. Generates DICOM SR output with TID 1500
    Measurement Report.

  # Entry point
  command: python -m maps.liver_lirads

  # Clinical metadata
  clinical_domain: abdominal_radiology
  body_region: liver
  modality: CT/MRI
  indication: hepatocellular_carcinoma_screening
  scoring_system: LI-RADS v2018
  target_population: adults_at_risk_for_hcc

input:
  - path: /input
    formats:
      - dicom
    description: >
      DICOM multiphase CT or MRI liver series. Requires arterial,
      portal venous, and delayed phase acquisitions. Minimum 30
      instances per phase recommended for CT, 15 for MRI.

output:
  - path: /output
    formats:
      - dicom-sr
      - json
    description: >
      DICOM Structured Report (TID 1500) with observation measurements,
      major features (APHE, washout, capsule), and LI-RADS classification.
      JSON result with full WorkflowResult.

resources:
  cpu: 4
  gpu: 1
  memory: 12Gi
  gpu_memory: 6Gi

timeout: 240

# NVIDIA technologies used
nvidia_technologies:
  - MONAI Deploy App SDK
  - TensorRT (optional)

# Model details
models:
  - name: Liver segmentation + observation detection
    architecture: SegResNet + RetinaNet
    source: MONAI Model Zoo
    input_shape: multiphase 1x4x192x192x192
    output: liver segmentation + observation detection with enhancement features

# Regulatory notes
regulatory:
  intended_use: >
    Research and development use only. Not cleared for clinical
    diagnostic use. Results must be reviewed by qualified physicians.
  classification: Class II (triage/notification)
  standards:
    - DICOM SR TID 1500
    - LI-RADS v2018 (ACR)
