[server]
port = 8525
address = "0.0.0.0"
headless = true
enableCORS = false
enableXsrfProtection = true
# SSL: Use nginx reverse proxy for production HTTPS
# Self-signed certs available at config/ssl/ for testing

[theme]
primaryColor = "#76B900"
