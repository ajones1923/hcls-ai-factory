name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (real-bug rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # High-signal rules only: syntax errors, undefined names, redefinitions,
      # bad return/yield. Style + unused-import cleanup is a separate
      # `ruff check --fix` pass, not a merge gate.
      - run: ruff check --select E9,F82,F811,F706,F707 core lib scripts

  platform:
    name: Platform library (hcls_common)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: lib/hcls_common
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  subjects:
    # The 17 engine/agent/disease-program suites — 8,402 tests. Until 2026-08-16 CI gated only the
    # 382 platform-library tests, so a change could break every subject and still merge green.
    #
    # scripts/run_all_tests.py is used rather than a bare `pytest` because two traps make a naive
    # invocation wrong: several subjects ship src/collections.py which SHADOWS the stdlib (putting
    # their src/ on PYTHONPATH kills the interpreter before collection), and zarr/fast-array-utils
    # register pytest plugins that import an application Settings model at startup and abort
    # collection for three subjects.
    name: Subject suites (8 engines, 8 agents, 1 program)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create the platform venv the harness expects
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e lib/hcls_common
      - name: Install subject runtime dependencies
        # Not in pyproject: these are per-engine runtime deps the suites import directly.
        run: |
          .venv/bin/pip install pytest pytest-asyncio fastapi "uvicorn[standard]" streamlit httpx \
                                duckdb statsmodels biopython peft pymilvus loguru anthropic \
                                prometheus-client apscheduler python-multipart tqdm python-dotenv
      - name: Run all 17 suites
        run: .venv/bin/python scripts/run_all_tests.py

  registry:
    name: Capability registry validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e lib/hcls_common
      - run: python scripts/validate_registry.py

  docs:
    name: Docs site (strict build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      # Strict build fails on broken links/nav AND runs the registry-bound
      # matrix generator, so a malformed registry breaks the site build here
      # (before Netlify) rather than publishing a stale page.
      - run: mkdocs build --strict

  # NOTE: per-component test jobs (path-filtered matrix over core/engines and
  # core/agents) land with the dependency-pinning work (constraints + extras),
  # so their heavy ML stacks install reproducibly. Until then, the platform
  # library, real-bug lint, and registry validation are the merge gate — all
  # run for real (no `|| true`).
