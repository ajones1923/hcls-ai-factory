# Dependency updates scoped to the current core/ monorepo layout.
# Grouped + capped on purpose: ~20 pip manifests ungrouped floods the PR queue
# (the mess this replaces). Major bumps still arrive as their own PRs for review.
# Out of scope: landing-page/ (its own repo, hcls-landing-page-dev) and any vendor-edition repo.
version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/"                    # requirements-docs.txt (docs site)
      - "/lib/hcls_common"     # the One Platform library
      - "/core/**"             # engines, agents, disease programs
      - "/hcls-orchestrator/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
