# Public docs site: GitHub -> MkDocs -> Netlify -> https://hcls-ai-factory.org
# Docs-as-code, deploy-on-merge. Keep this NEUTRAL (no vendor / alternate-edition branding).
# Pinned generator lives in requirements-docs.txt for a reproducible build.

site_name: HCLS AI Factory
site_description: >-
  Open-source precision-medicine platform — 8 engines, 8 intelligence agents, and the flagship
  Tuberous Sclerosis Complex disease program. Patient DNA to therapeutic candidates, in hours, on a
  single box. Decision support for a qualified clinician, never autonomous diagnosis.
site_url: https://hcls-ai-factory.org
site_author: HCLS AI Factory
copyright: >-
  Apache-2.0 · Decision support for a qualified clinician, never autonomous diagnosis or prescribing.

repo_url: https://github.com/ajones1923/hcls-ai-factory
repo_name: hcls-ai-factory
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon.svg
  icon:
    logo: material/dna
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/custom.css

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/site_gen_matrix.py
        - scripts/site_gen_pages.py

nav:
  - Home: index.md
  - The Factory:
      - Overview: factory/overview.md
      - Engines:
          - factory/engines/index.md
          - factory/engines/genomics-engine.md
          - factory/engines/precision-intelligence-engine.md
          - factory/engines/therapeutic-discovery-engine.md
          - factory/engines/imaging-intelligence-agent.md
          - factory/engines/precision-oncology-agent.md
          - factory/engines/cardiology-intelligence-agent.md
          - factory/engines/singlecell-compute.md
          - factory/engines/tuberous-sclerosis-engine.md
      - Intelligence Agents:
          - factory/agents/index.md
          - factory/agents/cart-intelligence-agent.md
          - factory/agents/precision-biomarker-agent.md
          - factory/agents/pharmacogenomics-intelligence-agent.md
          - factory/agents/precision-autoimmune-agent.md
          - factory/agents/neurology-intelligence-agent.md
          - factory/agents/clinical-trial-intelligence-agent.md
          - factory/agents/rare-disease-diagnostic-agent.md
          - factory/agents/single-cell-intelligence-agent.md
      - One Platform: factory/platform.md
      - Capability Brief: brief/README.md
  - Disease Programs:
      - Tuberous Sclerosis Complex: programs/tsc.md
  - Demonstrations: demos/index.md
  - Run It Yourself:
      - run/index.md
      - Hardware & Elastic Burst: run/hardware.md
      - Reproducibility & Datasets: run/reproducibility.md
  - Honesty & Governance:
      - Overview: honesty/index.md
      - Maturity Matrix: honesty/maturity-matrix.md
      - Honesty Ledger: honesty/ledger.md
      - Decision-Support Posture: honesty/decision-support.md
      - Citations & Evidence: honesty/citations.md
      - Governance & Lineage: honesty/governance.md
  - About / Mission: about.md
  - Roadmap: roadmap.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.blocks.caption
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Publish an intentional site (not the full WIP docs tree). Root-level WIP markdown is excluded;
# the intentional root pages (index, roadmap) and the section subdirs are kept.
exclude_docs: |
  /*.md
  /infographic_prompts/
  /working_prompts/
  /brief/architecture_figure.py
  !/index.md
  !/roadmap.md
  !/404.md
  !/about.md

# Fail the build on broken internal links / missing nav pages (Pillar 16).
validation:
  omitted_files: ignore
  absolute_links: ignore
  unrecognized_links: warn
  nav:
    not_found: warn
  links:
    not_found: warn
    anchors: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ajones1923/hcls-ai-factory
      name: HCLS AI Factory on GitHub
